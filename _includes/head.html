<head>
    <meta charset="utf-8">
    <!-- 移动端适配关键标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 预连接：提升第三方资源加载速度 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- SEO 与 Feed (Jekyll 自动处理) -->
    {%- seo -%}
    {%- feed_meta -%}

    <!-- 样式表：字体、图标、主样式 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/academicons/1.9.6/css/academicons.min.css">
    
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- 图标：支持暗色模式自动切换 -->
    <link rel="icon" href="{{ site.favicon | relative_url }}">
    {%- if site.favicon_dark -%}
    <link rel="icon" href="{{ site.favicon_dark | relative_url }}" media="(prefers-color-scheme: dark)">
    {%- endif -%}

    <!-- 统计：仅在生产环境加载 -->
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
        {%- include google-analytics.html -%}
    {%- endif -%}

    <!-- 数学公式支持 (建议配合 page.math 变量按需加载) -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
