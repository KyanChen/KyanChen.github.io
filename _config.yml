# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
theme: null
license: MIT


kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  auto_ids: true
  math_engine: mathjax
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]

sass:
  style: compressed
  # style: expanded
  # debug: true
  # trace: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be defined with either a path or a glob pattern.
#
collections:
  pages:
    output: true
    permalink: /:name/


exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
  - README.md
  - readme.md
  - LICENSE
  - .github/
  - .DS_Store

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "_pages"
    values:
      layout: "page"
